    let currentLang = localStorage.getItem('hrPartnerLang') || 'nl';

    function t(key) {
      return translations[currentLang][key] || '';
    }

    function changeLang(lang) {
      currentLang = lang;
      localStorage.setItem('hrPartnerLang', lang);
      render();
    }

    function handleSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      
      submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>${t('sendingMessage')}`;
      submitBtn.disabled = true;

      const formData = new FormData(form);
      const data = {
        name: formData.get('name'),
        email: formData.get('email'),
        message: formData.get('message')
      };

      // Wysyłanie emaila przez mailto (otwiera klienta email)
      const subject = encodeURIComponent(`Kontakt z ${data.name}`);
      const body = encodeURIComponent(`Imię: ${data.name}\nEmail: ${data.email}\n\nWiadomość:\n${data.message}`);
      window.location.href = `mailto:info@hrconsultingpartner.nl?subject=${subject}&body=${body}`;

      // Resetowanie formularza
      setTimeout(() => {
        form.reset();
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
        alert(t('successMessage'));
      }, 1000);
    }
