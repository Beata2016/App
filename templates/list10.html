    let currentFilter = 'all';
    let searchQuery = '';

    function t(key) { return translations[currentLang][key] || ''; }
    
    function changeLang(lang) { 
      currentLang = lang; 
      localStorage.setItem('hrPartnerLang', lang);
      render(); 
    }
    
    function filterCandidates(lang) { 
      currentFilter = lang; 
      renderCandidates(); 
    }

    function searchCandidates(query) {
      searchQuery = query.toLowerCase();
      renderCandidates();
    }

    function renderCandidates() {
      const container = document.getElementById('candidates-container');
      const countEl = document.getElementById('results-count');
      if (!container) return;
      
      let filtered = candidates;
      
      // Filter by language
      if (currentFilter !== 'all') {
        filtered = filtered.filter(c => c.primaryLang === currentFilter);
      }
      
      // Filter by search query
      if (searchQuery) {
        filtered = filtered.filter(c => {
          const profile = c.profiles[currentLang];
          const searchText = `${profile.name} ${profile.position} ${c.skills.join(' ')}`.toLowerCase();
          return searchText.includes(searchQuery);
        });
      }

      if (countEl) {
        countEl.textContent = `${filtered.length} ${t('resultsFound')}`;
      }
