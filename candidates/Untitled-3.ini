let currentLang = 'pl';

function t(key) {
  return translations[currentLang][key] || '';
}

function changeLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  render();
}

function render() {
  const app = document.getElementById('app');
  const team = translations[currentLang].teamMembers.map(member => `
    <div class="bg-white rounded-2xl p-6 text-center shadow-lg">
      <img src="${member.img}" alt="${member.name}" class="mx-auto rounded-full mb-4">
      <h3 class="text-xl font-bold mb-2 text-gray-900">${member.name}</h3>
      <p class="text-gray-700 text-sm">${member.role}</p>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="min-h-screen bg-white fade-in">
      <!-- Header -->
      <header class="fixed w-full bg-white shadow-sm z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
          <div class="text-2xl font-bold text-blue-600">${t('title')}</div>
          <nav class="hidden md:flex gap-8 text-sm">
            <a href="index.html" class="text-gray-700 hover:text-blue-600 cursor-pointer">${t('home')}</a>
            <a href="#" class="text-gray-700 hover:text-blue-600 cursor-pointer">${t('aboutUs')}</a>
            <a href="#contact" class="text-gray-700 hover:text-blue-600 cursor-pointer">${t('contact')}</a>
          </nav>
          <div class="flex gap-2">
            ${['pl','nl','en','cs','bg'].map(l => `<button onclick="changeLang('${l}')" class="px-3 py-2 rounded-lg text-sm font-semibold transition ${currentLang===l?'bg-blue-600 text-white':'bg-gray-200 text-gray-700 hover:bg-gray-300'}">${l.toUpperCase()}</button>`).join('')}
          </div>
        </div>
      </header>

      <!-- Hero -->
      <section class="pt-32 pb-20 px-4 bg-blue-50">
        <div class="max-w-5xl mx-auto text-center">
          <h1 class="text-5xl md:text-6xl font-bold text-blue-600 mb-4">${t('hero')}</h1>
          <p class="text-lg text-gray-700">${t('heroSub')}</p>
        </div>
      </section>

      <!-- Mission & Vision -->
      <section class="py-20 px-4">
        <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12">
          <div class="bg-white rounded-2xl p-10 shadow-lg">
            <h3 class="text-2xl font-bold mb-4 text-gray-900">${t('missionTitle')}</h3>
            <p class="text-gray-700">${t('missionText')}</p>
          </div>
          <div class="bg-white rounded-2xl p-10 shadow-lg">
            <h3 class="text-2xl font-bold mb-4 text-gray-900">${t('visionTitle')}</h3>
            <p class="text-gray-700">${t('visionText')}</p>
          </div>
        </div>
      </section>

      <!-- Values -->
      <section class="py-20 px-4 bg-gray-50">
        <div class="max-w-4xl mx-auto text-center">
          <h2 class="text-4xl font-bold mb-8">${t('valuesTitle')}</h2>
          <p class="text-gray-700 text-lg">${t('valuesText')}</p>
        </div>
      </section>

      <!-- Team -->
      <section class="py-20 px-4">
        <div class="max-w-6xl mx-auto">
          <h2 class="text-4xl font-bold text-center mb-12">${t('teamTitle')}</h2>
          <div class="grid md:grid-cols-3 gap-8">${team}</div>
        </div>
      </section>

      <!-- CTA -->
      <section class="py-20 px-4 bg-blue-600 text-white">
        <div class="max-w-3xl mx-auto text-center">
          <h2 class="text-4xl font-bold mb-6">${t('contactUs')}</h2>
          <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="jobs.html" class="bg-white text-blue-600 px-8 py-4 rounded-lg font-semibold hover:bg-gray-100">${t('viewJobs')}</a>
