<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Wyszukiwarka ofert pracy | JobFinder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* === GLOBAL === */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f9fafb;
      color: #111827;
      margin: 0;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #1e3a8a;
    }

    /* === HEADER === */
    header {
      background: #1e40af;
      color: white;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    header .logo {
      font-size: 20px;
      font-weight: 700;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      color: white;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    nav ul li a:hover {
      opacity: 0.8;
    }

    .lang-switch {
      display: flex;
      gap: 10px;
      font-size: 15px;
    }

    .lang-switch button {
      background: transparent;
      border: none;
      color: white;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      font-weight: 600;
    }

    .lang-switch button:hover {
      background: rgba(255,255,255,0.2);
    }

    /* === CONTAINER === */
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* === FORM === */
    form#job-search-form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      margin-bottom: 25px;
    }

    form label {
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }

    form input, form select {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
    }

    form button {
      margin-top: 16px;
      background: #1e40af;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    form button:hover {
      background: #1d4ed8;
    }

    /* === JOB RESULTS === */
    #results {
      display: grid;
      gap: 16px;
    }

    .job-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      padding: 18px;
      transition: transform 0.1s ease-in-out;
    }

    .job-card:hover {
      transform: translateY(-2px);
    }

    .job-card h3 {
      margin: 0 0 4px 0;
      color: #111827;
    }

    .muted {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .no-results {
      text-align: center;
      color: #6b7280;
      font-style: italic;
      margin-top: 20px;
    }

  </style>
</head>
<body>

  <!-- === HEADER === -->
  <header>
    <div class="logo">JobFinder</div>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about/">O nas</a></li>
        <li><a href="/contact/">Kontakt</a></li>
        <li><a href="/for-candidates/">Dla kandydatów</a></li>
        <li><a href="/for-companies/">Dla firm</a></li>
      </ul>
    </nav>
    <div class="lang-switch">
      <button>EN</button>
      <button>NL</button>
      <button class="active">PL</button>
      <button>CS</button>
      <button>BG</button>
    </div>
  </header>

  <!-- === MAIN === -->
  <div class="container">
    <h1>Oferty pracy</h1>

    <form id="job-search-form">
      <label for="q">Słowo kluczowe</label>
      <input type="text" name="q" id="q" placeholder="np. operator, kierowca, inżynier" />

      <label for="industry">Branża</label>
      <select name="industry" id="industry">
        <option value="">-- Wszystkie --</option>
        <option value="IND">Przemysł</option>
        <option value="LOG">Logistyka</option>
        <option value="IT">IT / Technologie</option>
        <option value="FOOD">Produkcja żywności</option>
        <option value="CONS">Budownictwo</option>
      </select>

      <label for="profession">Zawód</label>
      <select name="profession" id="profession">
        <option value="">-- Wszystkie --</option>
        <option value="OP">Operator</option>
        <option value="DRV">Kierowca</option>
        <option value="ENG">Inżynier</option>
        <option value="PRD">Pracownik produkcji</option>
        <option value="MNG">Manager</option>
      </select>

      <label for="location">Miejscowość</label>
      <input type="text" name="location" id="location" placeholder="np. Nijmegen, Wrocław" />

      <button type="submit">Szukaj</button>
    </form>

    <div id="results">
      <!-- wyniki pojawią się tutaj -->
    </div>
  </div>

  <!-- === JAVASCRIPT === -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("job-search-form");
      const resultsDiv = document.getElementById("results");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const query = new URLSearchParams(new FormData(form)).toString();
        resultsDiv.innerHTML = "<p class='muted'>Szukam ofert...</p>";

        try {
          const response = await fetch(`/api/jobs/?${query}`);
          const data = await response.json();

          resultsDiv.innerHTML = "";

          if (data.results.length === 0) {
            resultsDiv.innerHTML = "<p class='no-results'>Brak ofert spełniających kryteria.</p>";
            return;
          }

          data.results.forEach(job => {
            const card = document.createElement("div");
            card.className = "job-card";
            card.innerHTML = `
              <h3>${job.title}</h3>
              <div class="muted">${job.company} – ${job.location}</div>
              <div><strong>Branża:</strong> ${job.industry}</div>
              <div><strong>Zawód:</strong> ${job.role}</div>
              <div><strong>Typ:</strong> ${job.employment}</div>
              <div><strong>Język:</strong> ${job.language}</div>
              <p>${job.description}</p>
            `;
            resultsDiv.appendChild(card);
          });
        } catch (err) {
          resultsDiv.innerHTML = "<p class='no-results'>Błąd pobierania danych z serwera.</p>";
          console.error(err);
        }
      });
    });
  </script>

</body>
</html>
