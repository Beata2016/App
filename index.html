    let currentLang = 'nl';
    let currentFilter = 'all';
    let searchQuery = '';

    function t(key) { return translations[currentLang][key] || ''; }
    function changeLang(lang) { currentLang = lang; render(); }
    function filterJobs(lang) { currentFilter = lang; renderJobs(); }

    function performSearch() {
      const input = document.querySelector('#search-input');
      if (input) {
        searchQuery = input.value.trim();
        if (searchQuery) {
          // Przekieruj do bazy kandydatów z parametrem wyszukiwania
          window.location.href = `/baza-danych/?search=${encodeURIComponent(searchQuery)}`;
        }
      }
    }

    function renderJobs() {
      const container = document.getElementById('jobs-container');
      const filtered = currentFilter === 'all' ? jobs : jobs.filter(j => j.language === currentFilter);
      container.innerHTML = filtered.map(job => `
        <div class="bg-white border-2 border-gray-200 rounded-lg p-6 hover:shadow-lg transition">
          <div class="flex justify-between items-start mb-4">
            <h3 class="text-xl font-bold text-gray-900">${job.title}</h3>
            <span class="text-xs bg-blue-100 text-blue-600 px-3 py-1 rounded-full font-semibold">${job.language.toUpperCase()}</span>
          </div>
          <p class="text-gray-600 mb-2">${job.company}</p>
          <p class="text-gray-500 text-sm mb-6">${job.location}</p>
          <button onclick="window.location.href='/ogloszenia/'" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold">${t('searchBtn')}</button>
        </div>
      `).join('');
    }
